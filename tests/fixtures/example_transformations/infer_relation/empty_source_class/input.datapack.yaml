    file_a:
      content:
        filename: file_a.fastq
        format: FASTQ
        checksum: 1a5ac10ab42911dc0224172c118a326d9a4c03969112a2f3eb1ad971e96e92b8
        size: 12321
  Sample:
    sample_x:
      content:
        description: Some sample.
      relations:
        files:
          targetClass: File
          targetResources:
            - file_a
  Experiment: {}
