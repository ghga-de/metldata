# The 'Experiment' class -- the class the relation is inferred FOR -- has a slot
# but zero resources. This is a valid datapack: schemapack's
# MissingClassSlotValidationPlugin requires the slot to exist, not to be populated.
# The transformation must treat it as a no-op rather than raising
# EvitableTransformationError, which is what distinguishes `if resources is None`
# from the earlier `if not resources` in infer_relation.get_class_resources.
datapack: 4.2.0
resources:
